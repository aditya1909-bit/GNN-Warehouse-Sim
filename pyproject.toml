[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse_sim"
version = "0.9.0"
description = "Research-grade warehouse simulation scaffold with validated demand, graph, task, simulation, benchmark, observation, offline dispatch-model fitting, and plotting layers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=1.2",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "torch>=2.11",
  "torch_geometric>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
