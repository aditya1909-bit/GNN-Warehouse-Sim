name = "canonical_mlp_dispatch_fit"
seed = 7

[dataset]
source = "../../outputs/canonical_artifacts/dispatch_dataset"

[split]
split_unit = "scenario_seed"
train_fraction = 0.7
validation_fraction = 0.15
test_fraction = 0.15

[model]
type = "mlp"
hidden_dim = 16
learning_rate = 0.01
max_epochs = 400
l2_regularization = 0.0001
patience = 30
benchmark_weighting = true

[reporting]
output_dir = "../../outputs/canonical_artifacts/dispatch_mlp"
