name = "canonical_linear_dispatch_fit"
seed = 7

[dataset]
source = "../../outputs/canonical_artifacts/dispatch_dataset"

[split]
split_unit = "scenario_seed"
train_fraction = 0.7
validation_fraction = 0.15
test_fraction = 0.15

[model]
type = "linear"
learning_rate = 0.05
max_epochs = 300
l2_regularization = 0.0001
patience = 25
benchmark_weighting = true

[reporting]
output_dir = "../../outputs/canonical_artifacts/dispatch_linear"
