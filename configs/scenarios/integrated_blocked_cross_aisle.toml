name = "integrated_blocked_cross_aisle"

[layout]
rows = 6
columns = 6
edge_length = 1.0
travel_speed = 1.0
storage_cell = [0, 0]
dropoff_cell = [5, 5]
staging_cell = [5, 0]
blocked_cells = [[2, 1], [2, 2], [2, 3], [2, 4], [3, 2]]
directed_edges = []

[demand]
horizon_seconds = 180.0
mean_interval = 34.0
seed = 7
min_tasks = 0
rush_start = 50.0
rush_end = 150.0
rush_multiplier = 1.4
lunch_start = 180.0
lunch_end = 180.0

[robots]
count = 3
speed_multiplier = 1.0
initial_zone = "staging_zone"

[tasks]
default_pickup_zone = "storage_zone"
default_dropoff_zone = "dropoff_zone"
default_task_type = "pick"
default_priority = 1
default_service_time_estimate = 10.0
task_id_prefix = "task"

[simulation]
coordination_mode = "integrated"
policy = "prioritized_sipp_coordinator"
horizon_seconds = 180.0
continue_until_all_tasks_complete = true
execution_model = "idealized"

[coordination]
motion_model = "obstacle_aware_free_space"
control_dt = 0.25
replan_period = 1.0
robot_radius = 0.2
collision_clearance = 0.05
k_shortest_paths = 1
max_route_options_per_pair = 1

[reporting]
output_dir = "outputs/scenarios/integrated_blocked_cross_aisle"
write_plots = false
