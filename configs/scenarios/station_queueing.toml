name = "station_queueing"

[layout]
rows = 4
columns = 4
edge_length = 1.0
travel_speed = 1.0
storage_cell = [0, 0]
dropoff_cell = [0, 3]
staging_cell = [3, 0]
blocked_cells = []
directed_edges = []

[demand]
horizon_seconds = 660.0
mean_interval = 75.0
seed = 37
min_tasks = 0
rush_start = 180.0
rush_end = 540.0
lunch_start = 660.0
lunch_end = 660.0
rush_multiplier = 1.7

[robots]
count = 3
speed_multiplier = 1.0
initial_zone = "staging_zone"

[tasks]
default_pickup_zone = "storage_zone"
default_dropoff_zone = "dropoff_zone"
default_task_type = "pick"
default_priority = 1
default_service_time_estimate = 30.0
task_id_prefix = "task"

[simulation]
policy = "fifo"
horizon_seconds = 660.0
continue_until_all_tasks_complete = true
execution_model = "reserved_nodes"

[reporting]
output_dir = "outputs/scenarios/station_queueing"
write_plots = false
