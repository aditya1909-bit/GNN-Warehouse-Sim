name = "open_high_load"

[layout]
rows = 5
columns = 5
edge_length = 1.0
travel_speed = 1.0
storage_cell = [0, 0]
dropoff_cell = [4, 4]
staging_cell = [4, 0]
blocked_cells = []
directed_edges = []

[demand]
horizon_seconds = 720.0
mean_interval = 45.0
seed = 11
min_tasks = 0
rush_start = 120.0
rush_end = 540.0
lunch_start = 720.0
lunch_end = 720.0
rush_multiplier = 1.5

[robots]
count = 4
speed_multiplier = 1.0
initial_zone = "staging_zone"

[tasks]
default_pickup_zone = "storage_zone"
default_dropoff_zone = "dropoff_zone"
default_task_type = "pick"
default_priority = 1
default_service_time_estimate = 20.0
task_id_prefix = "task"

[simulation]
policy = "fifo"
horizon_seconds = 720.0
continue_until_all_tasks_complete = true
execution_model = "reserved_edges"

[reporting]
output_dir = "outputs/scenarios/open_high_load"
write_plots = false
