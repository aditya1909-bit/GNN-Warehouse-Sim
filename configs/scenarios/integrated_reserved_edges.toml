name = "integrated_reserved_edges"

[layout]
rows = 5
columns = 5
edge_length = 1.0
travel_speed = 1.0
storage_cell = [0, 0]
dropoff_cell = [4, 4]
staging_cell = [4, 0]
blocked_cells = [[1, 1], [1, 3], [3, 1], [3, 3]]
directed_edges = []

[demand]
horizon_seconds = 720.0
mean_interval = 58.0
seed = 23
min_tasks = 0
rush_start = 180.0
rush_end = 600.0
lunch_start = 720.0
lunch_end = 720.0
rush_multiplier = 1.4

[robots]
count = 4
speed_multiplier = 1.0
initial_zone = "staging_zone"

[tasks]
default_pickup_zone = "storage_zone"
default_dropoff_zone = "dropoff_zone"
default_task_type = "pick"
default_priority = 1
default_service_time_estimate = 18.0
task_id_prefix = "task"

[simulation]
coordination_mode = "integrated"
policy = "prioritized_sipp_coordinator"
horizon_seconds = 720.0
continue_until_all_tasks_complete = true
execution_model = "idealized"

[coordination]
motion_model = "graph_embedded"
control_dt = 0.25
replan_period = 1.0
robot_radius = 0.2
collision_clearance = 0.05
k_shortest_paths = 3
max_route_options_per_pair = 3

[reporting]
output_dir = "outputs/scenarios/integrated_reserved_edges"
write_plots = false
