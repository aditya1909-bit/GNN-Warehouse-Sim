name = "one_way_flow"

[layout]
rows = 3
columns = 4
edge_length = 1.0
travel_speed = 1.0
storage_cell = [0, 0]
dropoff_cell = [2, 3]
staging_cell = [2, 0]
blocked_cells = []
directed_edges = [
  [[0, 0], [0, 1]],
  [[0, 1], [0, 2]],
  [[0, 2], [0, 3]],
  [[1, 0], [1, 1]],
  [[1, 1], [1, 2]],
  [[1, 2], [1, 3]],
]

[demand]
horizon_seconds = 720.0
mean_interval = 90.0
seed = 13
min_tasks = 0
rush_start = 720.0
rush_end = 720.0
lunch_start = 720.0
lunch_end = 720.0
rush_multiplier = 1.0

[robots]
count = 2
speed_multiplier = 1.0
initial_zone = "staging_zone"

[tasks]
default_pickup_zone = "storage_zone"
default_dropoff_zone = "dropoff_zone"
default_task_type = "pick"
default_priority = 1
default_service_time_estimate = 50.0
task_id_prefix = "task"

[simulation]
policy = "fifo"
horizon_seconds = 720.0
continue_until_all_tasks_complete = true

[reporting]
output_dir = "outputs/scenarios/one_way_flow"
write_plots = false
