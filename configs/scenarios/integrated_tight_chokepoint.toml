name = "integrated_tight_chokepoint"

[layout]
rows = 6
columns = 6
edge_length = 1.0
travel_speed = 1.0
storage_cell = [0, 0]
dropoff_cell = [5, 5]
staging_cell = [5, 0]
blocked_cells = [[1, 1], [1, 2], [1, 4], [2, 1], [2, 4], [3, 1], [3, 4], [4, 1], [4, 2], [4, 4], [2, 3], [4, 3]]
directed_edges = []

[demand]
horizon_seconds = 900.0
mean_interval = 38.0
seed = 43
min_tasks = 0
rush_start = 150.0
rush_end = 780.0
lunch_start = 900.0
lunch_end = 900.0
rush_multiplier = 2.5

[robots]
count = 5
speed_multiplier = 1.0
initial_zone = "staging_zone"

[tasks]
default_pickup_zone = "storage_zone"
default_dropoff_zone = "dropoff_zone"
default_task_type = "pick"
default_priority = 1
default_service_time_estimate = 18.0
task_id_prefix = "task"

[simulation]
coordination_mode = "integrated"
policy = "prioritized_sipp_coordinator"
horizon_seconds = 900.0
continue_until_all_tasks_complete = true
execution_model = "idealized"

[coordination]
control_dt = 0.25
replan_period = 0.75
robot_radius = 0.2
collision_clearance = 0.05
k_shortest_paths = 4
max_route_options_per_pair = 4

[reporting]
output_dir = "outputs/scenarios/integrated_tight_chokepoint"
write_plots = false
