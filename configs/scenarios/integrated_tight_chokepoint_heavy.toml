name = "integrated_tight_chokepoint_heavy"

[layout]
rows = 10
columns = 10
edge_length = 1.0
travel_speed = 1.0
storage_cell = [0, 0]
dropoff_cell = [9, 9]
staging_cell = [9, 0]
blocked_cells = [[1, 3], [1, 4], [1, 6], [2, 3], [2, 6], [3, 3], [3, 6], [4, 3], [4, 6], [5, 3], [5, 6], [6, 3], [6, 6], [7, 3], [7, 4], [7, 6], [4, 4], [4, 5], [4, 7], [5, 4], [5, 5], [5, 7]]
directed_edges = []

[demand]
horizon_seconds = 2400.0
mean_interval = 22.0
seed = 61
min_tasks = 0
rush_start = 180.0
rush_end = 2220.0
lunch_start = 2400.0
lunch_end = 2400.0
rush_multiplier = 3.0

[robots]
count = 12
speed_multiplier = 1.0
initial_zone = "staging_zone"

[tasks]
default_pickup_zone = "storage_zone"
default_dropoff_zone = "dropoff_zone"
default_task_type = "pick"
default_priority = 1
default_service_time_estimate = 20.0
task_id_prefix = "task"

[simulation]
coordination_mode = "integrated"
policy = "prioritized_sipp_coordinator"
horizon_seconds = 2400.0
continue_until_all_tasks_complete = true
execution_model = "idealized"

[coordination]
control_dt = 0.25
replan_period = 0.5
robot_radius = 0.2
collision_clearance = 0.05
k_shortest_paths = 4
max_route_options_per_pair = 4

[reporting]
output_dir = "outputs/scenarios/integrated_tight_chokepoint_heavy"
write_plots = false
