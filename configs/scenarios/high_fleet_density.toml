name = "high_fleet_density"

[layout]
rows = 3
columns = 3
edge_length = 1.0
travel_speed = 1.0
storage_cell = [0, 0]
dropoff_cell = [2, 2]
staging_cell = [2, 0]
blocked_cells = []
directed_edges = []

[demand]
horizon_seconds = 600.0
mean_interval = 65.0
seed = 29
min_tasks = 0
rush_start = 180.0
rush_end = 420.0
lunch_start = 600.0
lunch_end = 600.0
rush_multiplier = 1.8

[robots]
count = 4
speed_multiplier = 1.0
initial_zone = "staging_zone"

[tasks]
default_pickup_zone = "storage_zone"
default_dropoff_zone = "dropoff_zone"
default_task_type = "pick"
default_priority = 1
default_service_time_estimate = 15.0
task_id_prefix = "task"

[simulation]
policy = "fifo"
horizon_seconds = 600.0
continue_until_all_tasks_complete = true
execution_model = "reserved_edges"

[reporting]
output_dir = "outputs/scenarios/high_fleet_density"
write_plots = false
