name = "unseen_demand_generalization"

[layout]
rows = 5
columns = 5
edge_length = 1.0
travel_speed = 1.0
storage_cell = [0, 0]
dropoff_cell = [4, 4]
staging_cell = [4, 0]
blocked_cells = [[1, 2], [2, 2], [3, 2]]
directed_edges = []

[demand]
horizon_seconds = 900.0
mean_interval = 52.0
seed = 19
min_tasks = 6
rush_start = 150.0
rush_end = 300.0
lunch_start = 330.0
lunch_end = 480.0
rush_multiplier = 2.0

[robots]
count = 4
speed_multiplier = 1.0
initial_zone = "staging_zone"

[tasks]
default_pickup_zone = "storage_zone"
default_dropoff_zone = "dropoff_zone"
default_task_type = "pick"
default_priority = 1
default_service_time_estimate = 18.0
task_id_prefix = "task"

[simulation]
policy = "fifo"
horizon_seconds = 900.0
continue_until_all_tasks_complete = true
execution_model = "reserved_nodes"

[reporting]
output_dir = "outputs/scenarios/unseen_demand_generalization"
write_plots = false
