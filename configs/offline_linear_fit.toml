name = "offline_linear_dispatch_fit"
seed = 7

[dataset]
source = "../outputs/linear_assignment_policy/dataset_manifest.json"

[split]
split_unit = "dispatch_group"
train_fraction = 0.7
validation_fraction = 0.15
test_fraction = 0.15

[model]
type = "linear"
learning_rate = 0.05
max_epochs = 300
l2_regularization = 0.0001
patience = 25

[reporting]
output_dir = "../outputs/offline/offline_linear_dispatch_fit"
