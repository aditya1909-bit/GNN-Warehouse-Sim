name = "graph_dispatch_rl_fine_tune"
pretrained_artifact_path = "../outputs/offline/offline_graph_dispatch_fit/model_artifact.json"

[curriculum]
scenario_configs = [
  "scenarios/narrow_bottleneck.toml",
  "scenarios/high_fleet_density.toml",
]
train_seeds = [7, 11, 13]
validation_seeds = [17, 19]

[reward]
task_completion = 1.0
waiting_time = -0.01
congestion_delay = -0.02
blocked_events = -0.05

[ppo]
learning_rate = 0.0003
clip_epsilon = 0.2
gamma = 0.99
gae_lambda = 0.95
ppo_epochs = 3
rollout_horizon = 8
total_episodes = 24

[output]
output_dir = "../outputs/rl/graph_dispatch_rl_fine_tune"
